name: Unit tests
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check syntax
        run: python -m compileall -q .
      - name: Test tracking and storage
        run: python -m unittest discover -s tests -v
